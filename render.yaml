services:
  # Base de Datos PostgreSQL
  - type: database
    name: bd_tienda
    databaseName: bd_tienda
    user: admin_user
    plan: free

  # Backend (Node.js/Express)
  - type: web
    name: backend-gestion-productos
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build # En caso de que se añadan pasos de compilación
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bd_tienda
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-gestion-productos.onrender.com # Ajustar tras el primer despliegue

  # Frontend (Static Site)
  - type: static
    name: frontend-gestion-productos
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://backend-gestion-productos.onrender.com/api # Ajustar tras el primer despliegue
