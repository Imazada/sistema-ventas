databases:
  - name: bd_tienda
    databaseName: bd_tienda
    user: admin_user

services:
  # Backend
  - type: web
    name: backend-gestion-productos
    env: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        fromDatabase:
          name: bd_tienda
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-gestion-productos.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

  # Frontend
  - type: web
    name: frontend-gestion-productos
    env: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps --production=false && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://backend-gestion-productos.onrender.com/api