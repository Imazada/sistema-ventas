databases:
  - name: bd_tienda
    databaseName: bd_tienda
    user: admin_user
    plan: free

services:
  # Backend
  - type: web
    name: backend-gestion-productos
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        fromDatabase:
          name: bd_tienda
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Frontend
  - type: web
    name: frontend-gestion-productos
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://backend-gestion-productos.onrender.com/api